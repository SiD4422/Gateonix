<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gateonix — Feedback | Share Your Experience</title>
  <meta name="description" content="Share your feedback, report bugs, or suggest features for Gateonix — the free browser-native digital logic circuit simulator for students and engineers."/>
  <meta name="keywords" content="Gateonix feedback, report bug, logic simulator feedback, suggest feature, contact Gateonix"/>
  <meta property="og:title" content="Gateonix Feedback — Help Us Improve"/>
  <meta property="og:description" content="Share your feedback, report bugs, or suggest new features for the Gateonix logic simulator."/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://gateonix.vercel.app/feedback"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Gateonix Feedback"/>
  <meta name="twitter:description" content="Share your feedback and help improve Gateonix — the free digital logic circuit simulator."/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="feedback-tab.css">
  <style>
    :root {
      --bg:       #080a0e;
      --panel:    #0f1218;
      --surface:  #161b24;
      --raised:   #1e2535;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.13);
      --accent:   #00d4aa;
      --accent2:  #00ffcc;
      --blue:     #40c4ff;
      --purple:   #9c6bff;
      --orange:   #ffa726;
      --red:      #ff5252;
      --green:    #00e676;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --font-ui:  'Syne', sans-serif;
      --font-mono:'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Particle canvas background ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── Orbs ── */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(100px);
      pointer-events: none; z-index: 0;
      animation: orb-float 16s ease-in-out infinite alternate;
    }
    .orb1 { width: 520px; height: 520px; background: rgba(0,212,170,0.07);  top: -200px; right: -160px; }
    .orb2 { width: 400px; height: 400px; background: rgba(64,196,255,0.05); bottom: -120px; left: -120px; animation-delay: -8s; }
    .orb3 { width: 280px; height: 280px; background: rgba(156,107,255,0.05); top: 50%; left: 35%; animation-delay: -4s; }
    @keyframes orb-float {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(24px, 18px) scale(1.04); }
    }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 56px;
      background: rgba(8,10,14,0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 32px; gap: 20px;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-icon { font-size: 22px; color: var(--accent); animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .nav-logo-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; color: var(--text); }
    .nav-links { display: flex; gap: 4px; margin-left: auto; }
    .nav-link {
      font-family: var(--font-mono); font-size: 11px; font-weight: 500;
      color: var(--muted); text-decoration: none; padding: 6px 14px;
      border-radius: 6px; transition: all 0.15s; letter-spacing: 0.04em;
    }
    .nav-link:hover { color: var(--text); background: var(--surface); }
    .nav-link.active { color: var(--accent); background: rgba(0,212,170,0.08); }
    .nav-cta {
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      color: #050e0b; background: var(--accent);
      padding: 7px 16px; border-radius: 6px; text-decoration: none;
      transition: all 0.15s; letter-spacing: 0.04em;
    }
    .nav-cta:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,212,170,0.28); }

    /* ── Main wrapper ── */
    main {
      position: relative; z-index: 1;
      padding-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Hero strip ── */
    .hero {
      width: 100%;
      padding: 80px 24px 60px;
      text-align: center;
      position: relative;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--accent); background: rgba(0,212,170,0.07);
      border: 1px solid rgba(0,212,170,0.22);
      padding: 5px 14px; border-radius: 20px; margin-bottom: 26px;
      opacity: 0; animation: fade-up 0.6s 0.1s forwards;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); animation: pulse 1.6s infinite;
    }

    .hero-title {
      font-weight: 800;
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 18px;
      opacity: 0; animation: fade-up 0.7s 0.25s forwards;
    }
    .hero-title .hl {
      background: linear-gradient(120deg, var(--accent) 0%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-family: var(--font-mono); font-size: 14px;
      color: var(--muted); line-height: 1.85; max-width: 480px;
      margin: 0 auto 48px;
      opacity: 0; animation: fade-up 0.7s 0.4s forwards;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Stats row ── */
    .stats-row {
      display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;
      margin-bottom: 64px;
      opacity: 0; animation: fade-up 0.7s 0.55s forwards;
    }
    .stat-chip {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--border2);
      border-radius: 10px; padding: 12px 18px;
    }
    .stat-icon { font-size: 18px; }
    .stat-info {}
    .stat-num { font-weight: 800; font-size: 20px; letter-spacing: -0.03em; color: var(--text); }
    .stat-lbl { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }

    /* ── Main card area ── */
    .card-area {
      width: 100%; max-width: 1060px; padding: 0 24px 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      opacity: 0; animation: fade-up 0.8s 0.6s forwards;
    }

    /* ── Left: preview card ── */
    .preview-card {
      background: var(--panel);
      border: 1px solid var(--border2);
      border-radius: 20px;
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .pc-header {
      background: linear-gradient(135deg, rgba(0,212,170,0.1) 0%, rgba(64,196,255,0.06) 100%);
      border-bottom: 1px solid var(--border2);
      padding: 28px 28px 24px;
      position: relative;
      overflow: hidden;
    }
    .pc-header::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(0,212,170,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .pc-eyebrow {
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 10px;
    }
    .pc-title {
      font-weight: 800; font-size: 22px; letter-spacing: -0.03em;
      color: var(--text); margin-bottom: 6px;
    }
    .pc-sub {
      font-family: var(--font-mono); font-size: 12px; color: var(--muted); line-height: 1.7;
    }

    /* Mock form questions */
    .pc-body { padding: 24px 28px; flex: 1; display: flex; flex-direction: column; gap: 18px; }

    .mock-q { }
    .mock-q-label {
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .mock-stars {
      display: flex; gap: 6px;
    }
    .star {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; transition: all 0.15s;
      color: var(--muted);
    }
    .star.filled { background: rgba(255,167,38,0.12); border-color: rgba(255,167,38,0.3); color: var(--orange); }
    .star:hover { transform: scale(1.12); }

    .mock-options {
      display: flex; flex-wrap: wrap; gap: 7px;
    }
    .mock-opt {
      font-family: var(--font-mono); font-size: 11px;
      padding: 5px 12px; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .mock-opt:hover, .mock-opt.sel {
      background: rgba(0,212,170,0.08); border-color: rgba(0,212,170,0.3);
      color: var(--accent);
    }

    .mock-textarea {
      width: 100%; padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border2);
      border-radius: 8px; color: var(--muted);
      font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
      resize: none; outline: none;
      pointer-events: none;
    }

    .pc-footer {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .pc-note {
      font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    }
    .pc-note span { color: var(--accent); }

    /* ── Right: CTA + info column ── */
    .cta-col {
      display: flex; flex-direction: column; gap: 16px;
    }

    .cta-main {
      background: var(--panel);
      border: 1px solid rgba(0,212,170,0.25);
      border-radius: 20px;
      padding: 36px 32px;
      flex: 1;
      display: flex; flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,212,170,0.06);
    }
    .cta-main::before {
      content: '';
      position: absolute; bottom: -60px; right: -60px;
      width: 220px; height: 220px;
      background: radial-gradient(circle, rgba(0,212,170,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }

    .cta-icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin-bottom: 20px;
    }
    .cta-heading {
      font-weight: 800; font-size: 24px; letter-spacing: -0.03em;
      color: var(--text); margin-bottom: 10px; line-height: 1.2;
    }
    .cta-body {
      font-family: var(--font-mono); font-size: 12px;
      color: var(--muted); line-height: 1.8; margin-bottom: 28px;
    }

    .btn-open-form {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--font-ui); font-weight: 700; font-size: 15px;
      color: #050e0b; background: var(--accent);
      padding: 15px 28px; border-radius: 10px;
      text-decoration: none; transition: all 0.18s;
      letter-spacing: 0.01em; border: none; cursor: pointer;
      position: relative; z-index: 1;
    }
    .btn-open-form:hover {
      background: var(--accent2); transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,212,170,0.35);
    }
    .btn-open-form:active { transform: translateY(0); }
    .btn-open-form svg { width: 16px; height: 16px; transition: transform 0.18s; }
    .btn-open-form:hover svg { transform: translateX(3px); }

    .btn-secondary-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 12px; font-weight: 500;
      color: var(--muted); text-decoration: none; margin-top: 14px;
      transition: color 0.15s;
    }
    .btn-secondary-link:hover { color: var(--text); }

    /* ── Info cards ── */
    .info-mini {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 22px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: border-color 0.18s;
    }
    .info-mini:hover { border-color: var(--border2); }
    .info-mini-icon {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .info-mini-title {
      font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 4px;
    }
    .info-mini-desc {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.65;
    }

    /* ── What we track section ── */
    .topics-section {
      width: 100%; max-width: 1060px;
      padding: 0 24px 80px;
    }
    .topics-label {
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 20px; text-align: center;
    }
    .topics-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .topic-card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
      transition: all 0.18s;
      position: relative; overflow: hidden;
    }
    .topic-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--tc-color, var(--accent));
      opacity: 0; transition: opacity 0.18s;
    }
    .topic-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .topic-card:hover::before { opacity: 1; }
    .topic-icon { font-size: 20px; margin-bottom: 10px; }
    .topic-name {
      font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 4px;
    }
    .topic-desc {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted); line-height: 1.6;
    }

    /* ── Divider ── */
    .divider {
      width: 100%; max-width: 1060px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2) 20%, var(--border2) 80%, transparent);
      margin: 0 auto 60px;
    }

    /* ── Thank-you bar ── */
    .thankyou-bar {
      width: 100%; max-width: 1060px;
      padding: 0 24px 80px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 20px;
    }
    .ty-left {}
    .ty-heading { font-weight: 800; font-size: 22px; letter-spacing: -0.03em; color: var(--text); margin-bottom: 6px; }
    .ty-sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); line-height: 1.7; max-width: 400px; }
    .ty-right { display: flex; gap: 10px; flex-wrap: wrap; }
    .ty-btn {
      font-family: var(--font-mono); font-size: 11px; font-weight: 700;
      color: var(--muted); background: var(--panel);
      border: 1px solid var(--border2); border-radius: 8px;
      padding: 9px 18px; text-decoration: none; transition: all 0.15s;
    }
    .ty-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.22); background: var(--surface); }
    .ty-btn.accent { color: var(--accent); border-color: rgba(0,212,170,0.3); background: rgba(0,212,170,0.06); }
    .ty-btn.accent:hover { background: rgba(0,212,170,0.12); }

    /* ── Reveal ── */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.65s ease, transform 0.65s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
      position: relative; z-index: 1;
      background: var(--panel);
    }
    .footer-logo { font-weight: 800; font-size: 14px; letter-spacing: -0.02em; color: var(--muted); }
    .footer-logo span { color: var(--accent); }
    .footer-links { display: flex; gap: 18px; }
    .footer-links a { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    .footer-links a:hover { color: var(--text); }
    .footer-copy { font-family: var(--font-mono); font-size: 10px; color: #2d3748; letter-spacing: 0.06em; }

    @media (max-width: 768px) {
      .card-area { grid-template-columns: 1fr; }
      .thankyou-bar { flex-direction: column; }
    }
  </style>
</head>

<canvas id="bg-canvas"></canvas>

<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Nav -->
<nav>
  <a class="nav-logo" href="index.html">
    <span class="nav-logo-icon">⬡</span>
    <span class="nav-logo-name">Gateonix</span>

  <div class="nav-links">

  <div style="width: 100%; max-width: 1000px; padding: 0 24px;">
    <!-- The embedded widget mounts here -->
    <div id="gtx-fb-embed"></div>
  </div>
</main>

<!-- Footer -->
<footer>
  <div class="footer-logo">Gate<span>onix</span></div>
  <div class="footer-links">
    <a href="index.html">Simulator</a>
    <a href="about.html">About</a>
    <a href="guide.html">Guide</a>
    <a href="feedback.html">Feedback</a>
  </div>

</footer>

<script>
  // ── Animated dot-grid background ────────────────────────────
  (function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, dots = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initDots() {
      dots = [];
      const cols = Math.ceil(W / 44), rows = Math.ceil(H / 44);
      for (let r = 0; r <= rows; r++) {
        for (let c = 0; c <= cols; c++) {
          dots.push({
            x: c * 44, y: r * 44,
            baseA: Math.random() * 0.04 + 0.01,
            a: 0, phase: Math.random() * Math.PI * 2,
            speed: 0.003 + Math.random() * 0.004
          });
        }
      }
    }

    let frame = 0;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      frame++;
      dots.forEach(d => {
        d.a = d.baseA + Math.sin(frame * d.speed + d.phase) * 0.025;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 1.1, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,212,170,${Math.max(0, d.a)})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); initDots(); });
    resize(); initDots(); draw();
  })();

  <!-- ── Scroll reveal ──────────────────────────────────────────── -->
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
